pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // Supplies the version build.gradle.kts deliberately omits, for a standalone build of
    // this directory (pnpm test:android / verify:android). A Capacitor app that includes the
    // module uses its own settings file, so AGP comes from the app's classpath there.
    plugins {
        id("com.android.library") version "9.3.1"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "inderun-capacitor"

// The IndeRun Android SDK modules are consumed as released Maven Central
// artifacts (app.independo.inderun:inderun-*); see build.gradle.kts. No
// composite/local module includes — this is a standalone Gradle build.
