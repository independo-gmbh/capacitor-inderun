version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait before proposing a freshly published version, mirroring the supply-chain
    # policy in the main monorepo.
    cooldown:
      default-days: 7
    ignore:
      # inderun is bumped by hand on all three platforms at once (see the
      # Versioning Policy in CLAUDE.md); a per-ecosystem bump drifts them apart.
      - dependency-name: "@independo/inderun-*"
      # Types track the oldest supported runtime (engines.node >=24), not the newest.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "app.independo.inderun:*"
      # compileOnly floor: compiling against a newer core could use APIs that
      # apps on the lowest supported Capacitor 8 release don't have.
      - dependency-name: "com.capacitorjs:core"
    groups:
      gradle-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "github.com/independo-gmbh/inderun"
    groups:
      swift-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-routine:
        patterns:
          - "*"
