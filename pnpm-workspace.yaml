overrides:
  # handlebars <=4.7.9: several template-compilation JavaScript-injection
  # advisories. Pulled in by semantic-release via conventional-changelog-writer,
  # which accepts ^4.7.7.
  handlebars@<4.7.10: "^4.7.10"
  # postcss <=8.5.22: path traversal via a previous source map, and an
  # incomplete fix of GHSA-6g55-p6wh-862q. Pulled in via vitest -> vite.
  postcss@<8.5.23: "^8.5.23"
  # nanoid <3.3.18: custom and non-secure generators can loop indefinitely.
  # Pulled in via postcss, which needs ^3.3.x, so keep the override on 3.x.
  nanoid@<3.3.18: "^3.3.18"
  # source-map-js <1.2.2: event-loop denial of service. Pulled in via postcss.
  source-map-js@<1.2.2: "^1.2.2"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@independo/inderun-contracts@0.3.2'
  - '@independo/inderun-route-core-wasm@0.3.2'
  - '@independo/inderun-web@0.3.2'
